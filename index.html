<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A custom right-click context menu implementation using vanilla JavaScript."
    />
    <title>Custom Context Menu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <h1>Right Click Anywhere</h1>
        <p>To see the custom context menu in action.</p>
      </div>
    </main>

    <div id="context-menu" class="context-menu">
      <ul class="menu-items">
        <li class="menu-item" data-action="Refresh">
          <span class="icon">↻</span> Refresh
        </li>
        <li class="menu-item" data-action="Settings">
          <span class="icon">⚙️</span> Settings
        </li>
        <li class="menu-item" data-action="About">
          <span class="icon">ℹ️</span> About
        </li>
        <li class="menu-item" data-action="Share">
          <span class="icon">🔗</span> Share
          <ul class="submenu">
            <li class="menu-item" data-action="CopyLink">
              <span class="icon">📋</span> Copy Link
            </li>
            <li class="menu-item" data-action="Twitter">
              <span class="icon">🐦</span> Twitter
            </li>
            <li class="menu-item" data-action="Facebook">
              <span class="icon">📘</span> Facebook
            </li>
          </ul>
        </li>
        <li class="menu-item" data-action="Theme">
          <span class="icon">🎨</span> Theme
        </li>
        <hr />
        <li class="menu-item delete" data-action="Exit">
          <span class="icon">🚪</span> Exit
        </li>
      </ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
